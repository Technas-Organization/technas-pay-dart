name: technas_pay_flutter
description: Faire payer depuis une app Flutter via Technas Pay, sans clé dans l'app - votre backend crée le paiement, l'app ouvre la page, attend et affiche l'état.
version: 0.4.0
repository: https://github.com/Technas-Organization/technas-pay-dart
publish_to: none # pub.dev : accord de Jonas d'abord

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  technas_pay:
    path: ..
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
