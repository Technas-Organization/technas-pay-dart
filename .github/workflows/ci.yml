name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Dépôt PUBLIC : machines GitHub, gratuites et isolées. Jamais les runners ARC du cluster ici :
    # une PR venue d'un fork y exécuterait son code à côté du Nexus et de Vault (décision de
    # Jonas, 15/11/2026). Ces tests n'ont besoin de rien chez nous (faux serveurs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 140 lib test example tool
      - run: dart analyze --fatal-infos
      - run: dart test
        env:
          TECHNAS_PAY_SECRET: tps_test_pk_ci.ws_ci
      - name: app.dart tient dans une app web/Flutter (aucun dart:io)
        run: dart compile js -o build/web_smoke.js tool/web_smoke.dart

  flutter:
    # Le paquet app : jamais de clé, relecture du statut, écrans d'état. Dépôt public : machines GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: technas_pay_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # La version de BeautyGo et des apps Technas : material.dart y est le chemin normal.
          flutter-version: 3.38.5
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 140 lib test example
      - run: flutter analyze --fatal-infos
      - run: flutter test
